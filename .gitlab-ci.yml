image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/akester/php:8.4

variables:
  DEPLOY_USER: trader

  GIT_SUBMODULE_STRATEGY: recursive

  DEPLOY_PATH: /home/web/html
  DEPLOY_SERVER: 10.0.8.36

# Define the stages of the pipeline
stages:
  - build
  - deploy

composer:
  stage: build
  script:
    - composer install --optimize-autoloader --no-dev
  artifacts:
    paths:
      - vendor/
    expire_in: 1 week

env:
  stage: build
  needs:
   - job: composer
     artifacts: true
  script:
    - cp .env.prod .env
    - php artisan key:generate

    - echo "COINBASE_KEY=\"$COINBASE_KEY\"" >> .env
    - echo "COINBASE_SECRET=\"$COINBASE_SECRET\"" >> .env

    - echo "NOTIFICATION_EMAIL=$NOTIFICATION_EMAIL" >> .env

    - echo "MAIL_USERNAME=$SMTP_USER" >> .env
    - echo "MAIL_PASSWORD=$SMTP_PASSWORD" >> .env
    - echo "MAIL_FROM_ADDRESS=$MAIL_FROM" >> .env
    - echo "MAIL_HOST=$SMTP_SERVER" >> .env

    - echo "DB_USERNAME=$DB_USER" >> .env
    - echo "DB_PASSWORD=$DB_PASS" >> .env
    - echo "DB_DATABASE=$DB_DATABASE" >> .env
  artifacts:
    paths:
      - .env
    expire_in: 1 week

node:
  stage: build
  image:
    name: node:24-alpine
    pull_policy: if-not-present
  script:
    - yarn install
    - yarn run build
  artifacts:
    paths:
      - node_modules
      - public/build
    expire_in: 1 week

deploy:
  stage: deploy
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/akester/rsync
  needs:
    - job: composer
      artifacts: true
    - job: env
      artifacts: true
    - job: node
      artifacts: true
  before_script:
    - eval $(ssh-agent -s)
    - /usr/bin/setup.sh

  script:
    - rsync -e 'ssh -p 2222' -rvh --exclude 'storage/' --delete ./ "$DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/"
    - ssh -p 2222 "$DEPLOY_USER@$DEPLOY_SERVER" "cd $DEPLOY_PATH && ./deploy.sh"
  
  only:
    - master